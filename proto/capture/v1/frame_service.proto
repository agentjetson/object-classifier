syntax = "proto3";

package capture.v1;

option cc_enable_arenas = true;

import "capture/v1/frame.proto";

// FrameService — camera-connector publishes live frames; object-classifier
// (and other consumers) subscribe over the network path.
service FrameService {
  // Server-streaming: client connects once and receives continuous frames.
  // Multiple concurrent subscribers are supported (fan-out from the queue).
  rpc Subscribe(SubscribeRequest) returns (stream FrameEnvelope);
}

message SubscribeRequest {
  // Optional camera / source filter. Empty = all sources on this node.
  string camera_id = 1;
  // Preferred encoding: "jpeg" (default) | "raw_bgr".
  // Server may fall back if the preferred encoding is unavailable.
  string preferred_encoding = 2;
}
