syntax = "proto3";

package capture.v1;

option cc_enable_arenas = true;

import "google/protobuf/timestamp.proto";

// Lightweight frame descriptor. Payload is either JPEG bytes or a reference
// (shared-memory key / file path) for zero-copy paths.
message FrameEnvelope {
  int64  frame_id           = 1;
  google.protobuf.Timestamp timestamp = 2;
  string source             = 3;   // camera_id / rtsp url / device path
  int32  width              = 4;
  int32  height             = 5;
  string encoding           = 6;   // "jpeg" | "raw_bgr" | "h264" | "nvmm"
  bytes  payload            = 7;   // optional; empty when using shm/ref
  string payload_ref        = 8;   // shm key or path when payload is empty
  map<string, string> labels = 9;
  double capture_latency_ms = 10;
}
